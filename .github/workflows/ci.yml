# Lance les tests du backend et du site à chaque push et à chaque pull request.
# Mêmes versions que le Dockerfile : Java 27 (Temurin) et Node 24.
# Les tests d'intégration démarrent PostgreSQL avec Testcontainers (Docker est présent sur les
# machines ubuntu de GitHub). Les bancs d'essai (modèles de langage) restent sautés : ils ne
# tournent qu'avec leurs variables d'environnement.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - run: sh mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
