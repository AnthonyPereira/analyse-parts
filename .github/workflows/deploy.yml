# Mise en ligne sur le serveur maison (ADR 0022), d'après le modèle de la doc « Serveur maison ».
# Différence avec le modèle : une seule image, « app », construite depuis la racine du dépôt
# (Dockerfile racine : site React + Spring Boot), au lieu de front/ et back/.
# Le job build tourne chez GitHub ; seul deploy tourne sur le portable (runner « serveur-maison »).
# Jamais sur pull_request : le runner exécuterait du code venu d'ailleurs.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-app:latest
            ${{ env.IMAGE_PREFIX }}-app:${{ github.sha }}
          # Cache des étapes Docker chez GitHub : npm ci et les dépendances Maven ne sont refaits
          # que si package-lock.json ou pom.xml changent
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, serveur-maison]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Déployer sur le portable
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOM="${GITHUB_REPOSITORY#*/}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          deploy-app "${NOM,,}" "ghcr.io/${GITHUB_REPOSITORY,,}"
          docker logout ghcr.io
