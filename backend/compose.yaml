services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=analyseparts'
      - 'POSTGRES_USER=analyseparts'
      - 'POSTGRES_PASSWORD=analyseparts'
    ports:
      - '5433:5432'  # 5432 est pris par le PostgreSQL Windows local
    volumes:
      - 'pgdata:/var/lib/postgresql/data'

  # Kafka en mode KRaft : un seul conteneur joue les deux rôles.
  #  - broker     : stocke les messages et répond aux producteurs / consommateurs ;
  #  - controller : tient la liste des topics, partitions et brokers (ce que faisait ZooKeeper avant Kafka 4).
  # Voir docs/kafka.md.
  kafka:
    image: 'apache/kafka:4.1.0'
    ports:
      - '9092:9092'  # pour l'application et les outils lancés depuis Windows
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Trois « portes » d'entrée :
      #  INTERNAL   (19092) : entre conteneurs du réseau Docker (Kafka UI) ;
      #  EXTERNAL   (9092)  : depuis Windows (l'application Spring Boot) ;
      #  CONTROLLER (9093)  : usage interne de Kafka.
      KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093'
      # L'adresse que le broker donne aux clients pour le rappeler, selon la porte utilisée.
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:19092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      # Un seul broker : chaque partition n'a qu'une copie (en production, 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3        # partitions d'un topic créé sans précision
      KAFKA_LOG_RETENTION_HOURS: 168 # les messages sont gardés 7 jours, lus ou non
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - 'kafkadata:/var/lib/kafka/data'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 10

  # Interface web pour voir les topics, les messages et la position de chaque consommateur.
  kafka-ui:
    image: 'ghcr.io/kafbat/kafka-ui:v1.3.0'
    ports:
      - '8081:8080'  # http://localhost:8081 (8080 est pris par l'application)
    environment:
      KAFKA_CLUSTERS_0_NAME: 'analyse-parts'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:19092'
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
  kafkadata:
