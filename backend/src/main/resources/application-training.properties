# Profil d'entraînement du cache AOT (Dockerfile, ADR 0016) : pendant la construction de l'image,
# l'application démarre une fois sur un PostgreSQL temporaire et vide, puis s'arrête
# (spring.context.exit=onRefresh). Java enregistre les classes chargées et liées ; au vrai
# démarrage, il les reprend du cache.

spring.docker.compose.enabled=false
spring.datasource.url=jdbc:postgresql://localhost:5432/training
spring.datasource.username=training
spring.datasource.password=training
analyse-parts.analysis.auto=false
analyse-parts.score-history.backfill-on-startup=false
analyse-parts.ingestion.auto-lei=false
