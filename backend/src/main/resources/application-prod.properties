# Profil de production (démo publique, ADR 0016) : activé par SPRING_PROFILES_ACTIVE=prod.
# Hébergement gratuit : Render (512 Mo de mémoire, mis en veille après 15 min sans visite)
# et PostgreSQL chez Neon (1 Go).

# Base : fournie par l'hébergeur, jamais par Docker Compose
spring.docker.compose.enabled=false
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Petit pool : la base gratuite accepte peu de connexions et le serveur n'a que 512 Mo
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# Le port est imposé par l'hébergeur (variable PORT)
server.port=${PORT:8080}
server.compression.enabled=true

# Santé : statut seul, sans le détail de chaque source
management.endpoint.health.show-details=never
# /actuator/health/liveness répond sans interroger la base : c'est l'adresse que cron-job.org
# appelle toutes les 10 min, en semaine de 6 h à 20 h, pour garder le serveur éveillé sans
# consommer le quota de calcul de Neon (100 h·CU par mois).
management.endpoint.health.probes.enabled=true

# Le serveur ne tourne qu'en semaine de 6 h à 20 h (heure de Paris, -Duser.timezone dans le
# Dockerfile) : les collectes de nuit passent le matin.
analyse-parts.esef.amf-refresh-cron=0 5 7 * * MON-FRI
analyse-parts.euronext.factsheet-cron=0 15 7 * * MON-FRI
analyse-parts.esef.refresh-cron=0 30 7 * * MON

# Pas de modèle de langage en production : les lectures déjà en base restent affichées,
# aucune nouvelle lecture n'est lancée (la lecture par LLM est en pause).
analyse-parts.analysis.auto=false

# Démarrage léger sur un petit serveur : l'historique des notes est déjà dans la base copiée.
analyse-parts.score-history.backfill-on-startup=false

# Routes /api/admin/** : refusées sans l'en-tête X-Admin-Token (voir AdminTokenFilter)
analyse-parts.admin-token=${ADMIN_TOKEN}
