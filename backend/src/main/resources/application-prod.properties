# Profil de production : activé par SPRING_PROFILES_ACTIVE=prod (Dockerfile).
# Hébergement : le serveur maison (ADR 0022), allumé en permanence, avec sa base PostgreSQL dans
# le même docker-compose.yml. Les collectes gardent leurs horaires habituels (application.properties).

# Base : fournie par docker-compose.yml (service db), jamais par le Docker Compose de Spring
spring.docker.compose.enabled=false
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8

server.port=${PORT:8080}
server.compression.enabled=true
# Derrière Traefik et Cloudflare : l'adresse du visiteur et le https viennent des en-têtes X-Forwarded-*
server.forward-headers-strategy=framework

# Santé : statut seul, sans le détail de chaque source
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Pas de modèle de langage en production : les rapports sont lus sur le PC (profil reader,
# ADR 0019) et les lectures copiées dans la base ; le serveur ne fait que les afficher.
analyse-parts.analysis.auto=false

# L'historique des notes vient de la base copiée : pas de reconstruction au démarrage.
analyse-parts.score-history.backfill-on-startup=false

# Routes /api/admin/** : refusées sans l'en-tête X-Admin-Token (voir AdminTokenFilter)
analyse-parts.admin-token=${ADMIN_TOKEN}
