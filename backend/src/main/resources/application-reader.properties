# Lecteur local (ADR 0019) : activé par SPRING_PROFILES_ACTIVE=reader, lancé par scripts/lecteur.ps1.
# Le PC qui a le modèle de langage (Ollama) se branche sur la base en ligne (Neon), lit les rapports
# pas encore lus et y enregistre les lectures. Il ne fait rien d'autre : la collecte des rapports,
# des cours et des notes reste celle du serveur en ligne.

# Base en ligne, adresse directe (pas le « pooler »), fournie par le script
spring.docker.compose.enabled=false
spring.datasource.url=${READER_DATABASE_URL}
spring.datasource.username=${READER_DATABASE_USER}
spring.datasource.password=${READER_DATABASE_PASSWORD}
# Aucune connexion gardée ouverte entre deux écritures : la base gratuite s'endort au bout de
# 5 min sans activité, et son quota de calcul (100 h·CU par mois) ne tourne pas pendant les lectures.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

# Le schéma appartient au serveur en ligne : déployer d'abord, lancer le lecteur ensuite.
spring.flyway.enabled=false

# Ni site ni API : rien à servir
spring.main.web-application-type=none

# Aucune tâche planifiée (collectes, cours, historique), pas de calcul des notes au démarrage
analyse-parts.scheduling.enabled=false
analyse-parts.scoring.warm-up=false
analyse-parts.score-history.backfill-on-startup=false
# Les événements en attente sont ceux du serveur en ligne : ce n'est pas au lecteur de les rejouer
spring.modulith.events.republish-outstanding-events-on-restart=false

# La boucle du lecteur (ReportReaderLoop) remplace la lecture déclenchée par un nouveau rapport
analyse-parts.analysis.auto=false
analyse-parts.reader.enabled=true
analyse-parts.reader.poll-minutes=${READER_POLL_MINUTES:30}
# Lectures écrites par paquets de 6 (environ 30 min de lecture) : la base dort entre deux paquets
analyse-parts.analysis.save-batch=${READER_SAVE_BATCH:6}
