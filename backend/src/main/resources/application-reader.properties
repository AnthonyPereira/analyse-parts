# Lecteur local (ADR 0019, 0023) : activé par SPRING_PROFILES_ACTIVE=reader, lancé par scripts/lecteur.ps1.
# Le PC qui a le modèle de langage (Ollama) lit les rapports pas encore lus et enregistre les lectures
# dans sa base locale ; scripts/publier-lectures.ps1 les copie ensuite sur le serveur maison. Il ne
# fait rien d'autre : la collecte des rapports, des cours et des notes reste celle du serveur.

# Base locale (backend/compose.yaml), fournie par le script
spring.docker.compose.enabled=false
spring.datasource.url=${READER_DATABASE_URL}
spring.datasource.username=${READER_DATABASE_USER}
spring.datasource.password=${READER_DATABASE_PASSWORD}
# Une lecture dure des minutes : inutile de garder des connexions ouvertes entre deux écritures
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

# Le lecteur ne migre pas la base : lancer une fois l'application en développement après une mise à jour
spring.flyway.enabled=false

# Ni site ni API : rien à servir
spring.main.web-application-type=none

# Aucune tâche planifiée (collectes, cours, historique), pas de calcul des notes au démarrage
analyse-parts.scheduling.enabled=false
analyse-parts.scoring.warm-up=false
analyse-parts.score-history.backfill-on-startup=false
# Les événements en attente sont ceux de l'application complète : ce n'est pas au lecteur de les rejouer
spring.modulith.events.republish-outstanding-events-on-restart=false

# La boucle du lecteur (ReportReaderLoop) remplace la lecture déclenchée par un nouveau rapport
analyse-parts.analysis.auto=false
analyse-parts.reader.enabled=true
analyse-parts.reader.poll-minutes=${READER_POLL_MINUTES:30}
# Chaque lecture est écrite dès qu'elle est finie (scripts/lecteur.ps1 met 1) ; plus pour regrouper
analyse-parts.analysis.save-batch=${READER_SAVE_BATCH:1}
