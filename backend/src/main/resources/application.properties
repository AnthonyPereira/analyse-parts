spring.application.name=analyse-parts

# Docker Compose : Spring démarre compose.yaml au lancement et garde les conteneurs ensuite
spring.docker.compose.lifecycle-management=start-only

# JPA : le schéma est géré uniquement par Flyway, Hibernate se contente de valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Threads virtuels (Java 21+) : les traitements @Async et les requêtes HTTP ne bloquent pas de threads système
spring.threads.virtual.enabled=true

# Spring Modulith : au redémarrage, rejoue les événements dont le listener n'a pas abouti
spring.modulith.events.republish-outstanding-events-on-restart=true

management.endpoints.web.exposure.include=health,info

# Santé : détail de chaque indicateur (application locale), et un statut DEGRADED pour une source
# externe en panne (voir SourceHealthIndicator) : moins grave que DOWN, et toujours HTTP 200.
management.endpoint.health.show-details=always
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
management.endpoint.health.status.http-mapping.DEGRADED=200
