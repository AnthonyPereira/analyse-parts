spring.application.name=analyse-parts

# Docker Compose : Spring démarre compose.yaml au lancement et garde les conteneurs ensuite
spring.docker.compose.lifecycle-management=start-only

# JPA : le schéma est géré uniquement par Flyway, Hibernate se contente de valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Threads virtuels (Java 21+) : les traitements @Async et les requêtes HTTP ne bloquent pas de threads système
spring.threads.virtual.enabled=true

# Spring Modulith : au redémarrage, rejoue les événements dont le listener n'a pas abouti
spring.modulith.events.republish-outstanding-events-on-restart=true

management.endpoints.web.exposure.include=health,info

# Santé : détail de chaque indicateur (application locale), et un statut DEGRADED pour une source
# externe en panne (voir SourceHealthIndicator) : moins grave que DOWN, et toujours HTTP 200.
management.endpoint.health.show-details=always
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
management.endpoint.health.status.http-mapping.DEGRADED=200

# Lecture des rapports annuels par le modèle de langage local (Ollama), ADR 0011 et 0012.
# qwen3:14b trouve de meilleurs risques que qwen3:8b (environ 4 min par rapport contre 1 min 20).
# Avec 10 240 tokens de contexte, il tient presque entièrement dans 12 Go de mémoire graphique
# (40 couches sur 41) ; avec 16 384, il déborde sur le processeur et devient bien plus lent.
# Un lot de 14 passages (environ 6 000 tokens) plus la réponse (2 500 au plus) tient dans 10 240.
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${ANALYSIS_MODEL:qwen3:14b}
spring.ai.ollama.embedding.options.model=bge-m3
analyse-parts.analysis.context-tokens=${ANALYSIS_CONTEXT_TOKENS:10240}
# Relecture : le modèle vérifie que chaque citation appuie bien son point. Thèmes relus : true (tous),
# false (aucun) ou une liste. Pas les risques : sur L'Oréal, la relecture retirait des risques réels
# appuyés par une citation trop faible (change, cybersécurité). ADR 0014.
analyse-parts.analysis.review=${ANALYSIS_REVIEW:BUSINESS,ADVANTAGES}
# Lire automatiquement chaque nouveau rapport annuel (occupe la carte graphique quelques minutes).
analyse-parts.analysis.auto=true
