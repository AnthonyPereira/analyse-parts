spring.application.name=analyse-parts

# Docker Compose : Spring démarre compose.yaml au lancement et garde les conteneurs ensuite
spring.docker.compose.lifecycle-management=start-only

# JPA : le schéma est géré uniquement par Flyway, Hibernate se contente de valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Threads virtuels (Java 21+) : les traitements @Async et les requêtes HTTP ne bloquent pas de threads système
spring.threads.virtual.enabled=true

# Spring Modulith : au redémarrage, rejoue les événements dont le listener n'a pas abouti
spring.modulith.events.republish-outstanding-events-on-restart=true

management.endpoints.web.exposure.include=health,info

# Kafka : l'adresse vient de compose.yaml (support Docker Compose), sinon localhost:9092.
# Clés et valeurs en texte (JSON écrit et lu par l'application) : lisibles dans Kafka UI.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Si Kafka est arrêté, send() abandonne après 5 s au lieu de 60 : un cours perdu n'est pas grave.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Le client Kafka affiche toute sa configuration au démarrage : seulement les avertissements
logging.level.org.apache.kafka=WARN

# Outbox Spring Modulith → Kafka (topic « filings ») : le JSON est écrit par l'application
# (FilingTopic), on garde donc les sérialiseurs texte ci-dessus au lieu de ceux de Modulith.
spring.modulith.events.kafka.enable-json=false
